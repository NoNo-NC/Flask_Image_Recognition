repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: pylint
        name: Pylint application modules
        entry: python -m pylint app.py model.py
        language: system
        pass_filenames: false
        types: [python]
        require_serial: true
